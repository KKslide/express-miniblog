<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <!-- 优先使用 IE 最新版本和 Chrome -->
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
    <!-- 移动端视口设置 -->
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0,maximum-scale=1,minimum-scale=1,user-scalable=no">
    <!-- 页面描述 -->
    <meta content="description" name="too young to die, too old to live, kk, Vlog, kk个人网站, kk个人博客, kk空间">
    <!-- 页面关键词 -->
    <meta name="keywords" content="kkslide, 刘永康, 前端, 影视后期, Vue, AE, Pr, Gopro, 剪辑" />
    <!-- 网页作者 -->
    <meta name="author" content="刘永康, rollercompanion@163.com" />
    <!-- 是否启用 WebApp 全屏模式，删除苹果默认的工具栏和菜单栏 -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes">
    <!-- 设置苹果工具栏颜色 -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <!-- 忽略页面中的数字识别为电话，忽略email识别 -->
    <meta name="format-detection" content="telphone=no, email=no" />
    <meta name="msapplication-tap-highlight" content="no">
    <meta name="robots" content="all">
    <!-- 网站所有权 -->
    <meta name="copyright" content="liuyongkang">
    <meta name="verify" content="index,follow" />
    <meta name="google" content="index,follow" />
    <meta name="googlebot" content="index,follow" />
    <!-- 指定首选URL，声明一个权威网页做为复制网页的规范版本 -->
    <link rel="canonical" href="http://www.kkslide.fun/">
    <link rel="apple-touch-icon" sizes="180x180" href="./static/skull.png">
    <link href="./static/skull.ico" rel="icon">
    
    <link rel="stylesheet" href="<%= process.env.VUE_APP_CSS_ELEMENTUI %>">
    <link rel="stylesheet" href="<%= process.env.VUE_APP_CSS_BOOTSTRAP %>">
    <link rel="stylesheet" href="<%= process.env.VUE_APP_CSS_VIDEOJS %>">
    <link rel="stylesheet" href="<%= process.env.VUE_APP_CSS_WANGEDITOR %>">
    <link rel="stylesheet" href="<%= process.env.VUE_APP_CSS_HIGHLIGHT %>">

    <script src="<%= process.env.VUE_APP_JS_ELEMENTUI %>"></script>
    <script src="<%= process.env.VUE_APP_JS_JQ %>"></script>
    <script src="<%= process.env.VUE_APP_JS_BOOTSTRAP %>"></script>
    <script src="<%= process.env.VUE_APP_JS_WANTEDITOR %>"></script>
    <script src="<%= process.env.VUE_APP_JS_HIGHLIGHT %>"></script>
    <script src="<%= process.env.VUE_APP_JS_TYPEDJS %>"></script>
    <script src="<%= process.env.VUE_APP_JS_VIDEOJS %>"></script>
    <script src="<%= process.env.VUE_APP_JS_VIDEOJS_CONTROL %>"></script>
    <script src="<%= process.env.VUE_APP_JS_VUEI18N %>"></script>
    <script src="<%= process.env.VUE_APP_JS_ECHARTS %>"></script>
    <script src="<%= process.env.VUE_APP_JS_RX %>"></script>
    <script src="<%= process.env.VUE_APP_JS_IMG_LOADED %>"></script>
